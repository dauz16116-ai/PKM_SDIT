<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - SDIT Kedisiplinan & Tahfizh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container" style="max-width: 400px;">
        <div class="card shadow border-0">
            <div class="card-body p-4 text-center">
                <img src="{{ url_for('static', filename='logo-sdit.png') }}" alt="Logo" class="mb-3" style="max-height: 80px;">
                <h4 class="card-title fw-bold text-success">SDIT SIMA</h4>
                <p class="text-muted small">Pencatatan Tahsin, Tahfidz & Poin Siswa</p>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} p-2 text-start small">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" action="/login" class="text-start mt-3">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required placeholder="Masukkan username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="Masukkan password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Akses Sebagai</label>
                        <select name="role" class="form-select" required>
                            <option value="admin">Administrator</option>
                            <option value="guru">Guru / Musyrif Tahfizh</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mt-2">Masuk</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
